name: Validate Python RC2 release artifacts
on:
  push:
    branches: [validate/python-release-rc2]
permissions:
  contents: read
jobs:
  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable

      - name: Check generated binary licenses
        run: python fluss-rust/bindings/python/generate_binary_license.py --check

      - uses: PyO3/maturin-action@v1
        with:
          working-directory: fluss-rust/bindings/python
          command: sdist
          args: -o dist

      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: fluss-rust/bindings/python/dist

  wheels:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { os: windows-latest, license-target: "x86_64-pc-windows-msvc" }
          - { os: macos-15-intel, target: "x86_64-apple-darwin", license-target: "x86_64-apple-darwin" }
          - { os: macos-15, target: "aarch64-apple-darwin", license-target: "aarch64-apple-darwin" }
          - { os: ubuntu-latest, target: "x86_64", license-target: "x86_64-unknown-linux-gnu" }
          - { os: ubuntu-latest, target: "aarch64", manylinux: "manylinux_2_28", license-target: "aarch64-unknown-linux-gnu" }
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable

      - name: Generate licenses for this wheel target
        run: python fluss-rust/bindings/python/generate_binary_license.py --target "${{ matrix.license-target }}"

      - uses: PyO3/maturin-action@v1
        with:
          working-directory: fluss-rust/bindings/python
          target: ${{ matrix.target }}
          command: build
          args: --locked --release -o dist -i python3.9
          manylinux: ${{ matrix.manylinux || 'auto' }}
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: fluss-rust/bindings/python
          target: ${{ matrix.target }}
          command: build
          args: --locked --release -o dist -i python3.10
          manylinux: ${{ matrix.manylinux || 'auto' }}
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: fluss-rust/bindings/python
          target: ${{ matrix.target }}
          command: build
          args: --locked --release -o dist -i python3.11
          manylinux: ${{ matrix.manylinux || 'auto' }}
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: fluss-rust/bindings/python
          target: ${{ matrix.target }}
          command: build
          args: --locked --release -o dist -i python3.12
          manylinux: ${{ matrix.manylinux || 'auto' }}

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target || 'native' }}
          path: |
            fluss-rust/bindings/python/dist/*.whl
            fluss-rust/bindings/python/LICENSE-bin
            fluss-rust/bindings/python/NOTICE-bin

  verify-license:
    name: Verify LICENSE and NOTICE
    runs-on: ubuntu-latest
    needs: [sdist, wheels]
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: false
          path: artifacts

      # maturin ships these only when [project].license-files lists them.
      - name: Check the sdist and every wheel
        run: |
          SDIST=$(ls artifacts/wheels-sdist/*.tar.gz)
          PREFIX=$(basename "$SDIST" .tar.gz)
          for f in LICENSE NOTICE LICENSE-bin NOTICE-bin; do
            if [ -z "$(tar -xzOf "$SDIST" "${PREFIX}/${f}" 2>/dev/null)" ]; then
              echo "Error: ${f} is missing or empty at the root of ${SDIST}"
              exit 1
            fi
          done
          for whl in artifacts/wheels-*/dist/*.whl; do
            artifact_dir=$(dirname "$(dirname "$whl")")
            for f in LICENSE NOTICE LICENSE-bin NOTICE-bin; do
              if ! unzip -p "$whl" "*.dist-info/licenses/${f}" 2>/dev/null | grep . >/dev/null; then
                echo "Error: ${f} is missing or empty in ${whl}"
                exit 1
              fi
            done
            for f in LICENSE-bin NOTICE-bin; do
              if ! unzip -p "$whl" "*.dist-info/licenses/${f}" | diff -u "${artifact_dir}/${f}" -; then
                echo "Error: packaged ${f} differs from the generated file in ${whl}"
                exit 1
              fi
            done
          done
