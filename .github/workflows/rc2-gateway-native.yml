# Publish the fluss Python binding to PyPI.
# Trigger: push tag only (e.g. v0.1.0).
# Pre-release tags (containing '-') publish to TestPyPI; release tags publish to PyPI.
#
# Auth: PyPI/TestPyPI Trusted Publishing (OIDC). The pyfluss publisher config on both
# indexes must name this repository and this workflow file; no secret is involved.

name: Build Fluss RC2 Gateway on native amd64
on:
  push:
    branches: [release-tools/fluss-1.0.0-rc2-native]
permissions:
  contents: read
jobs:
  gateway:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          repository: apache/fluss
          ref: 4adcc19fcac77deb0ff19144dd790217d5ed0f0a
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      - name: Build native executable from the immutable RC2 commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          test "$(git rev-parse HEAD)" = 4adcc19fcac77deb0ff19144dd790217d5ed0f0a
          git diff --exit-code
          docker buildx build --platform linux/amd64 \
            --file docker/fluss-gateway/Dockerfile.build --target artifact \
            --output type=local,dest=artifacts .
          test "$(artifacts/fluss-gateway --version)" = 'fluss-gateway 1.0.0'
          git rev-parse HEAD > artifacts/RELEASE_COMMIT
          cd artifacts
          sha512sum fluss-gateway > fluss-gateway.sha512
          tar -czf gateway-native-amd64.tgz fluss-gateway fluss-gateway.sha512 RELEASE_COMMIT
      - uses: actions/upload-artifact@v4
        with:
          name: gateway-native-amd64-4adcc19fcac77deb0ff19144dd790217d5ed0f0a
          path: artifacts/gateway-native-amd64.tgz
          retention-days: 7
          if-no-files-found: error
